name: fleet-base-sepolia-events
resource_size: xs
sources:
  # A new source identity backfills this Governor instead of resuming the old
  # contract feed's checkpoint. Keep it stable for later routine deployments.
  # https://docs.goldsky.com/turbo-pipelines/cli-reference#apply-a-pipeline
  fleet_bond_v4_logs:
    type: dataset
    dataset_name: base_sepolia.raw_logs
    version: 1.0.0
    primary_key: id
    start_at: earliest
    filter: >-
      block_number >= 46915091 AND
      address IN ('0x6621b6e4dfd16c5bccce7cd696666f5508c7d87d', '0xed9bd5da2439f2561a49b570708fda273fc82e4a')
transforms:
  fleet_events:
    type: sql
    primary_key: id
    sql: |
      SELECT id, address, block_number, block_hash, transaction_hash,
             transaction_index, log_index, data, topics, block_timestamp, _gs_op
      FROM fleet_bond_v4_logs
      WHERE block_number >= 46915091 AND address IN
        ('0x6621b6e4dfd16c5bccce7cd696666f5508c7d87d', '0xed9bd5da2439f2561a49b570708fda273fc82e4a')
sinks:
  history:
    type: webhook
    from: fleet_events
    url: https://fleet-governance-indexer-449245570324.us-central1.run.app/goldsky
    secret_name: FLEET_GOVERNANCE_HISTORY
    primary_key: id
    one_row_per_request: false
    batch_size: 100
    batch_flush_interval: 1s
