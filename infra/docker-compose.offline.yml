# Local/offline overlay: local stand-in for the GCS archive bucket used by
# cpls and agora-next (infra/docker-compose.yml's base cpls/agora-next
# services target real GCS). Use with the base file, not on its own:
#   docker compose -f infra/docker-compose.yml -f infra/docker-compose.offline.yml up -d
#
# This adds fake-gcs and points cpls at it via STORAGE_EMULATOR_HOST, which
# google-cloud-storage's Client() reads directly: when set, it swaps in
# AnonymousCredentials instead of resolving GOOGLE_APPLICATION_CREDENTIALS/ADC,
# so the base file's /dev/null credentials placeholder is never actually
# parsed while this overlay is applied. agora-next has no such SDK/emulator
# split (its archive reads are plain unauthenticated fetch() calls, see
# src/lib/archiveUtils.ts): it only needs ARCHIVE_GCS_BUCKET_OVERRIDE
# repointed at fake-gcs's base URL instead of storage.googleapis.com.
services:
  cpls:
    environment:
      STORAGE_EMULATOR_HOST: http://fake-gcs:4443
    depends_on:
      fake-gcs:
        condition: service_started

  agora-next:
    environment:
      ARCHIVE_GCS_BUCKET_OVERRIDE: http://fake-gcs:4443/${GCS_BUCKET_NAME:-fleet-archive-dev}
    depends_on:
      fake-gcs:
        condition: service_started

  # infra/scripts/create-fake-bucket.sh creates the bucket cpls writes to
  # once this is up.
  fake-gcs:
    # Pinned rather than :latest, so a rebuild months from now brings up the
    # same emulator this stack was verified against. 1.56.1 is what :latest
    # resolved to at the time of writing
    # (sha256:797ce226d62f947c009dc40246b30cfb456b8473d8241407f9d6f2c04e4d69ef).
    image: fsouza/fake-gcs-server:1.56.1
    restart: unless-stopped
    # -public-host must match the Host header the REQUESTER actually sends,
    # not where fake-gcs itself listens: fake-gcs-server 404s a path-style
    # object read (GET /<bucket>/<object>, the URL shape
    # ARCHIVE_GCS_BUCKET_OVERRIDE above builds and src/lib/archiveUtils.ts's
    # plain http.get()/fetch() calls use directly, never the JSON API's
    # /storage/v1/b/.../o/... path) whenever the request's Host header
    # doesn't match -public-host exactly. Every reader of that URL (Agora
    # Next's own server-side archive fetches; this container's compose
    # network hostname is "fake-gcs") is itself another container on this
    # compose network, so "fake-gcs:4443" is what that Host header actually
    # is; "localhost:4443" only matched requests made directly from the
    # host machine (e.g. this file's own create-fake-bucket.sh, or a
    # developer's curl), which never hit this path-style endpoint anyway
    # (create-fake-bucket.sh's POST and this project's own verification
    # curls all use the JSON API, which is not host-gated the same way).
    # See docs/compatibility-notes.md, Task 6, "Agora Next's archive reads
    # 404 silently: fake-gcs-server's path-style access is host-gated".
    command: ["-scheme", "http", "-port", "4443", "-public-host", "fake-gcs:4443", "-external-url", "http://fake-gcs:4443"]
    ports:
      - "${FAKE_GCS_PORT:-4443}:4443"
