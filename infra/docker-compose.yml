services:
  anvil:
    build:
      context: ..
      dockerfile: infra/anvil/Dockerfile
    ports:
      - "${ANVIL_PORT:-8545}:8545"
    healthcheck:
      test: ["CMD", "cast", "chain-id", "--rpc-url", "http://127.0.0.1:8545"]
      interval: 5s
      timeout: 5s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-agora}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
    ports:
      # Host port defaults to 55432 (not 5432) so this stack can run
      # alongside a host Postgres already listening on 5432. The container
      # always listens on 5432 internally.
      - "${POSTGRES_PORT:-55432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agora -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  dao-node:
    build:
      context: ..
      dockerfile: infra/dao-node/Dockerfile
    ports:
      - "${DAO_NODE_PORT:-8000}:8000"
    environment:
      CONTRACT_DEPLOYMENT: ${CONTRACT_DEPLOYMENT:-local}
      CHAIN_ID: ${CHAIN_ID:-31337}
      TOKEN_ADDRESS: ${TOKEN_ADDRESS}
      GOVERNOR_ADDRESS: ${GOVERNOR_ADDRESS}
      DAO_NODE_START_BLOCK: ${DAO_NODE_START_BLOCK}
      DAO_NODE_ARCHIVE_NODE_HTTP: http://anvil:8545
      DAO_NODE_REALTIME_NODE_WS: ws://anvil:8545
      ABI_DIR: /abis
    volumes:
      - ./dao-node/abis:/abis:ro
    depends_on:
      anvil:
        condition: service_healthy
    healthcheck:
      # python:3.11-slim (Debian trixie) has no curl; the interpreter that
      # is already in the image is the smallest reliable healthcheck tool.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/progress', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
