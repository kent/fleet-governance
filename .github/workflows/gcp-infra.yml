name: GCP infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: Infrastructure operation
        type: choice
        options: [plan, apply, provision-readside, start, stop, import-cdp, import-rpc, import-openrouter, prepare-wallets, inspect-demo, stop-experiment, arm-compute, inspect-compute, compute-drill, release-compute, sync-compute-votes, verify-simulation, prepare-simulation, release-preparation, retry-preparation, inspect-simulation]
        default: plan
      machine_type:
        description: Pilot VM type
        type: choice
        options: [e2-standard-8, e2-standard-4]
        default: e2-standard-8
      max_run_hours:
        description: Automatic VM stop after this many hours (1 to 24)
        type: string
        default: '4'
      compute_request:
        description: 'arm-compute only: JSON with runId, governor, requiredProposalIds, approvalSeconds'
        type: string
        default: '{}'
      allocation_id:
        description: 'release-compute only: exact halted allocation UUID; explicit human authorisation to release the latch'
        type: string
        default: ''
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ startsWith(inputs.action, 'inspect-') && format('gcp-fleet-inspect-{0}', github.run_id) || 'gcp-fleet-governance' }}
  cancel-in-progress: false
env:
  CLOUDSDK_CORE_PROJECT: fleet-governance
  TF_IN_AUTOMATION: 'true'
  TF_VAR_machine_type: ${{ inputs.machine_type }}
  TF_VAR_max_run_hours: ${{ inputs.max_run_hours }}
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify secret importer
        if: startsWith(inputs.action, 'import-')
        run: python3 -B -m unittest discover -s infra/gcp/tests -v
      - name: Import dedicated experiment model key
        if: inputs.action == 'import-openrouter'
        env:
          OPENROUTER_BOOTSTRAP_CREDENTIALS: ${{ secrets.OPENROUTER_BOOTSTRAP_CREDENTIALS }}
        run: python3 -B infra/gcp/import-secrets.py --kind openrouter
      - name: Import CDP credentials into Secret Manager
        if: inputs.action == 'import-cdp'
        env:
          CDP_BOOTSTRAP_CREDENTIALS: ${{ secrets.CDP_BOOTSTRAP_CREDENTIALS }}
        run: python3 -B infra/gcp/import-secrets.py --kind cdp
      - name: Verify and import Base Sepolia RPC endpoints
        if: inputs.action == 'import-rpc'
        env:
          RPC_BOOTSTRAP_CREDENTIALS: ${{ secrets.RPC_BOOTSTRAP_CREDENTIALS }}
        run: |
          node infra/gcp/verify-rpc.mjs
          python3 -B infra/gcp/import-secrets.py --kind rpc
      - name: Start or stop the research VM
        if: inputs.action == 'start' || inputs.action == 'stop'
        env:
          VM_ACTION: ${{ inputs.action }}
        run: |
          if [[ "$VM_ACTION" == start ]]; then python3 -B infra/gcp/assert-compute-unarmed.py; fi
          gcloud compute instances "$VM_ACTION" fleet-research --zone=us-central1-a --quiet
      - name: Prepare and fund five testnet agent wallets
        if: inputs.action == 'prepare-wallets'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          npm install -g pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec vitest run --project unit apps/runner/src/cloud/wallets.test.ts
          node apps/runner/dist/cloud/prepare-wallets.js
      - name: Build and verify compute policy administration
        if: contains(fromJSON('["arm-compute","inspect-compute","compute-drill","release-compute","verify-simulation","release-preparation","retry-preparation","inspect-simulation"]'), inputs.action)
        run: |
          npm install -g pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec vitest run --project unit apps/runner/src/cloud/compute-policy.test.ts apps/runner/src/cloud/compute-controller.test.ts apps/runner/src/cloud/compute-admin.test.ts apps/runner/src/cloud/compute-task-gate.test.ts
      - name: Check simulation proposal preparation without writes
        if: inputs.action == 'inspect-simulation'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: node apps/runner/dist/cloud/simulation-preflight.js
      - name: Inspect external compute policy
        if: inputs.action == 'inspect-compute'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          node apps/runner/dist/cloud/compute-admin-cli.js inspect
          gcloud compute instances describe fleet-research --zone=us-central1-a --format='json(id,status,lastStartTimestamp,scheduling,resourceStatus)'
          gcloud run services describe fleet-compute-controller --region=us-central1 --format='yaml(status.conditions,status.url)'
          gcloud scheduler jobs describe fleet-compute-policy --location=us-central1 --format='yaml(state,status,lastAttemptTime,schedule)'
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="fleet-compute-controller"' --freshness=30m --limit=15 --format='json(timestamp,textPayload,httpRequest.status)'
          gcloud run jobs describe fleet-simulation --region=us-central1 --format='yaml(status.latestCreatedExecution)'
          execution=$(gcloud run jobs describe fleet-simulation --region=us-central1 --format='value(status.latestCreatedExecution.name)')
          if [[ "$execution" =~ ^fleet-simulation-[a-z0-9]+$ ]]; then
            gcloud run jobs executions describe "$execution" --region=us-central1 --format='yaml(status.conditions,status.runningCount,status.failedCount,status.succeededCount,status.startTime,status.completionTime)'
          fi
          gcloud logging read 'resource.type="cloud_run_job" AND resource.labels.job_name="fleet-simulation"' --freshness=30m --limit=20 --format='json(timestamp,textPayload,jsonPayload)'
      - name: Arm the operator-selected required proposals
        if: inputs.action == 'arm-compute'
        env:
          FLEET_GCP_CLI_AUTH: '1'
          COMPUTE_REQUEST: ${{ inputs.compute_request }}
        run: |
          node apps/runner/dist/cloud/compute-admin-cli.js arm
          gcloud scheduler jobs run fleet-compute-policy --location=us-central1
      - name: Verify runtime IAM and start a shutdown witness
        if: contains(fromJSON('["compute-drill","prepare-simulation"]'), inputs.action)
        run: |
          python3 -B infra/gcp/assert-compute-unarmed.py
          gcloud compute scp infra/gcp/runtime/compute-canary.py fleet-research:~/fleet-compute-canary.py --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo python3 "$HOME/fleet-compute-canary.py"'
      - name: Defeat a real Base Sepolia vote and observe external VM shutdown
        if: inputs.action == 'compute-drill'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          node apps/runner/dist/cloud/compute-drill.js
          if python3 -B infra/gcp/assert-compute-unarmed.py; then
            echo 'Restart gate unexpectedly allowed a halted worker' >&2
            exit 1
          fi
          echo 'A real required vote was defeated. The independent controller verified the VM TERMINATED. Routine CI restart was rejected. Ballots were scripted; no model credits used.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify five actual model votes and independent GCP shutdown
        if: inputs.action == 'verify-simulation'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          node apps/runner/dist/cloud/simulation-evidence.js
          if python3 -B infra/gcp/assert-compute-unarmed.py; then
            echo 'Restart gate unexpectedly allowed a halted simulation' >&2
            exit 1
          fi
          echo 'Five actual agent ballots independently verified on Base Sepolia. The separate controller stopped the VM and routine restart was denied.' >> "$GITHUB_STEP_SUMMARY"
      - name: Verify the stop caller in GCP audit logs
        if: contains(fromJSON('["compute-drill","verify-simulation"]'), inputs.action)
        run: |
          for attempt in $(seq 1 12); do
            gcloud logging read 'resource.type="gce_instance" AND protoPayload.methodName:"compute.instances.stop" AND protoPayload.authenticationInfo.principalEmail="fleet-compute-controller@fleet-governance.iam.gserviceaccount.com"' --freshness=15m --limit=10 --format='json(timestamp,protoPayload.authenticationInfo.principalEmail,protoPayload.methodName,protoPayload.resourceName)' > compute-audit.json
            if python3 -c 'import json; assert json.load(open("compute-audit.json"))'; then
              cat compute-audit.json
              exit 0
            fi
            sleep 10
          done
          echo 'The controller stop call was not found in the audit-log window.' >&2
          exit 1
      - name: Preserve public shutdown evidence
        if: always() && contains(fromJSON('["compute-drill","verify-simulation"]'), inputs.action)
        run: |
          for file in compute-allocation.json compute-drill-votes.json compute-drill-evidence.json compute-audit.json; do
            if [[ -f "$file" ]]; then gcloud storage cp "$file" "gs://fleet-governance-control-449245570324/evidence/$GITHUB_RUN_ID/$file"; fi
          done
          if [[ -f compute-drill-evidence.json ]]; then
            gcloud storage cp compute-drill-evidence.json gs://fleet-governance-control-449245570324/evidence/latest.json
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always() && contains(fromJSON('["compute-drill","verify-simulation"]'), inputs.action)
        with:
          name: compute-shutdown-evidence
          path: compute-*.json
          if-no-files-found: ignore
      - name: Retire the controller before explicit operator recovery
        if: inputs.action == 'release-compute'
        env:
          FLEET_GCP_CLI_AUTH: '1'
          COMPUTE_ALLOCATION_ID: ${{ inputs.allocation_id }}
        run: |
          node apps/runner/dist/cloud/compute-admin-cli.js check-release
          # Retire the old service so an old invocation cannot act on a later VM start.
          # Recreating this service and its Scheduler binding is part of the next deploy.
          gcloud scheduler jobs pause fleet-compute-policy --location=us-central1
          gcloud run services delete fleet-compute-controller --region=us-central1 --quiet
          # The controller request timeout is 120 seconds. Retire in-flight
          # invocations before releasing the old latch or permitting a new start.
          for _ in 1 2 3; do sleep 45; done
          state=$(gcloud compute instances describe fleet-research --zone=us-central1-a --format='value(status)')
          if [[ "$state" == RUNNING ]]; then
            gcloud compute instances stop fleet-research --zone=us-central1-a --quiet
          elif [[ "$state" != TERMINATED ]]; then
            echo 'VM must finish its current operation before recovery.' >&2
            exit 1
          fi
          node apps/runner/dist/cloud/compute-admin-cli.js release
          echo 'Human recovery released the allocation. The VM remains stopped and this run remains blocked. Deploy through GitHub to restore the controller and start a fresh run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Retry cloud startup for the same unclaimed human request
        if: inputs.action == 'retry-preparation'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          node apps/runner/dist/cloud/compute-admin-cli.js check-preparation-retry
          gcloud run jobs execute fleet-simulation --region=us-central1 --async --quiet
      - name: Recover a finished preparation job that never armed compute
        if: inputs.action == 'release-preparation'
        env:
          FLEET_GCP_CLI_AUTH: '1'
          COMPUTE_REQUEST: ${{ inputs.compute_request }}
        run: |
          node apps/runner/dist/cloud/compute-admin-cli.js check-preparation
          state=$(gcloud compute instances describe fleet-research --zone=us-central1-a --format='value(status)')
          if [[ "$state" == RUNNING ]]; then
            gcloud compute instances stop fleet-research --zone=us-central1-a --quiet
          elif [[ "$state" != TERMINATED ]]; then
            echo 'Wait for the current VM operation before recovery.' >&2
            exit 1
          fi
          node apps/runner/dist/cloud/compute-admin-cli.js release-preparation
      - name: Stop agent execution and preserve experiment files
        if: inputs.action == 'stop-experiment'
        run: |
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet \
            --command='sudo systemctl stop fleet-runner.service && ! sudo systemctl is-active --quiet fleet-runner.service'
          echo 'Runner stopped. Existing chain records and experiment files are preserved. Redeploy to restart the worker.' >> "$GITHUB_STEP_SUMMARY"
      - name: Index the recorded shutdown ballots after operator recovery
        if: inputs.action == 'sync-compute-votes'
        run: |
          gcloud compute scp infra/gcp/runtime/import-compute-votes.mjs fleet-research:~/fleet-import-compute-votes.mjs --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet --command='sudo install -m 600 "$HOME/fleet-import-compute-votes.mjs" /srv/fleet/state/verification/import-compute-votes.mjs && sudo docker exec fleet-runner node /srv/fleet/state/verification/import-compute-votes.mjs'
      - name: Inspect the deployed demo without exposing credentials
        if: inputs.action == 'inspect-demo'
        run: |
          gcloud run services describe fleet-governance --region=us-central1 \
            --format='yaml(status.conditions,status.latestCreatedRevisionName,status.latestReadyRevisionName,status.traffic)'
          revision=$(gcloud run services describe fleet-governance --region=us-central1 --format='value(status.latestCreatedRevisionName)')
          if [[ -n "$revision" ]]; then
            gcloud run revisions describe "$revision" --region=us-central1 \
              --format='yaml(metadata.name,status.conditions,status.logUrl)'
          fi
          gcloud compute instances describe fleet-research --zone=us-central1-a --format='yaml(status,networkInterfaces.networkIP)'
          remote="fleet-inspect-$GITHUB_RUN_ID.py"
          gcloud compute scp infra/gcp/runtime/inspect-vm.py "fleet-research:~/$remote" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo python3 \$HOME/$remote"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: inputs.action == 'plan' || inputs.action == 'apply' || inputs.action == 'provision-readside'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Bootstrap the private state bucket
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          bucket=gs://fleet-governance-tfstate-449245570324
          if ! gcloud storage buckets describe "$bucket" >/dev/null 2>&1; then
            gcloud storage buckets create "$bucket" --location=us-central1 --uniform-bucket-level-access --public-access-prevention
          fi
          gcloud storage buckets update "$bucket" --versioning --public-access-prevention
      - name: Validate and plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra/gcp
        run: |
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=foundation.tfplan
      - name: Apply the saved plan
        if: inputs.action == 'apply'
        working-directory: infra/gcp
        run: |
          terraform apply -input=false foundation.tfplan
          terraform output -json > foundation-outputs.json
          gcloud storage cp foundation-outputs.json gs://fleet-governance-artifacts-449245570324/foundation/outputs.json
          terraform output >> "$GITHUB_STEP_SUMMARY"

      - name: Provision only the independent history resources
        if: inputs.action == 'provision-readside'
        working-directory: infra/gcp
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=readside.tfplan
          terraform show -json readside.tfplan > readside-plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open('readside-plan.json'))
          for resource in plan.get('resource_changes', []):
              actions = resource['change']['actions']
              if actions == ['no-op'] or actions == ['read']:
                  continue
              if not resource['name'].startswith('readside') or ('delete' in actions and resource['type'] != 'google_storage_bucket_iam_member'):
                  raise SystemExit('Unexpected infrastructure mutation: ' + resource['address'])
              print(resource['address'], actions)
          PY
          terraform apply -input=false readside.tfplan
      - name: Initialise managed pipeline credentials without logging values
        if: inputs.action == 'provision-readside'
        env:
          GOLDSKY_BOOTSTRAP_CREDENTIALS: ${{ secrets.GOLDSKY_BOOTSTRAP_CREDENTIALS }}
        run: |
          python3 - <<'PY'
          import os, secrets, subprocess
          for name in ['fleet-goldsky-webhook-token', 'fleet-goldsky-api-token']:
              result = subprocess.run(['gcloud','secrets','versions','describe','1','--secret='+name,'--format=value(state)'], capture_output=True, text=True)
              if result.returncode == 0:
                  assert result.stdout.strip() == 'ENABLED'
                  continue
              value = secrets.token_urlsafe(32) if name.endswith('webhook-token') else os.environ['GOLDSKY_BOOTSTRAP_CREDENTIALS'].strip()
              assert value, 'Goldsky bootstrap credential is missing'
              subprocess.run(['gcloud','secrets','versions','add',name,'--data-file=-'], input=value, text=True, check=True, stdout=subprocess.DEVNULL)
              print('Initialised '+name)
          PY
      - name: Confirm worker remains stopped and history host is separate
        if: inputs.action == 'provision-readside'
        run: |
          gcloud compute instances list --filter='name=(fleet-research fleet-readside)' \
            --format='table(name,status,machineType.basename(),serviceAccounts.email)'
