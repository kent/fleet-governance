name: GCP infrastructure
on:
  workflow_dispatch:
    inputs:
      action:
        description: Infrastructure operation
        type: choice
        options: [plan, apply, start, stop, import-cdp, import-rpc, import-openrouter, prepare-wallets, inspect-demo, stop-experiment]
        default: plan
      machine_type:
        description: Pilot VM type
        type: choice
        options: [e2-standard-8, e2-standard-4]
        default: e2-standard-8
      max_run_hours:
        description: Automatic VM stop after this many hours (1 to 24)
        type: string
        default: '4'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ${{ inputs.action == 'inspect-demo' && format('gcp-fleet-inspect-{0}', github.run_id) || 'gcp-fleet-governance' }}
  cancel-in-progress: false
env:
  CLOUDSDK_CORE_PROJECT: fleet-governance
  TF_IN_AUTOMATION: 'true'
  TF_VAR_machine_type: ${{ inputs.machine_type }}
  TF_VAR_max_run_hours: ${{ inputs.max_run_hours }}
jobs:
  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Verify secret importer
        if: startsWith(inputs.action, 'import-')
        run: python3 -B -m unittest discover -s infra/gcp/tests -v
      - name: Import dedicated experiment model key
        if: inputs.action == 'import-openrouter'
        env:
          OPENROUTER_BOOTSTRAP_CREDENTIALS: ${{ secrets.OPENROUTER_BOOTSTRAP_CREDENTIALS }}
        run: python3 -B infra/gcp/import-secrets.py --kind openrouter
      - name: Import CDP credentials into Secret Manager
        if: inputs.action == 'import-cdp'
        env:
          CDP_BOOTSTRAP_CREDENTIALS: ${{ secrets.CDP_BOOTSTRAP_CREDENTIALS }}
        run: python3 -B infra/gcp/import-secrets.py --kind cdp
      - name: Verify and import Base Sepolia RPC endpoints
        if: inputs.action == 'import-rpc'
        env:
          RPC_BOOTSTRAP_CREDENTIALS: ${{ secrets.RPC_BOOTSTRAP_CREDENTIALS }}
        run: |
          node infra/gcp/verify-rpc.mjs
          python3 -B infra/gcp/import-secrets.py --kind rpc
      - name: Start or stop the research VM
        if: inputs.action == 'start' || inputs.action == 'stop'
        env:
          VM_ACTION: ${{ inputs.action }}
        run: gcloud compute instances "$VM_ACTION" fleet-research --zone=us-central1-a --quiet
      - name: Prepare and fund five testnet agent wallets
        if: inputs.action == 'prepare-wallets'
        env:
          FLEET_GCP_CLI_AUTH: '1'
        run: |
          npm install -g pnpm@11.9.0
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm exec vitest run --project unit apps/runner/src/cloud/wallets.test.ts
          node apps/runner/dist/cloud/prepare-wallets.js
      - name: Stop agent execution and preserve experiment files
        if: inputs.action == 'stop-experiment'
        run: |
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet \
            --command='sudo systemctl stop fleet-runner.service && ! sudo systemctl is-active --quiet fleet-runner.service'
          echo 'Runner stopped. Existing chain records and experiment files are preserved. Redeploy to restart the worker.' >> "$GITHUB_STEP_SUMMARY"
      - name: Inspect the deployed demo without exposing credentials
        if: inputs.action == 'inspect-demo'
        run: |
          gcloud compute instances describe fleet-research --zone=us-central1-a --format='yaml(status,networkInterfaces.networkIP)'
          remote="fleet-inspect-$GITHUB_RUN_ID.py"
          gcloud compute scp infra/gcp/runtime/inspect-vm.py "fleet-research:~/$remote" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet --command="sudo python3 \$HOME/$remote"
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        if: inputs.action == 'plan' || inputs.action == 'apply'
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Bootstrap the private state bucket
        if: inputs.action == 'plan' || inputs.action == 'apply'
        run: |
          bucket=gs://fleet-governance-tfstate-449245570324
          if ! gcloud storage buckets describe "$bucket" >/dev/null 2>&1; then
            gcloud storage buckets create "$bucket" --location=us-central1 --uniform-bucket-level-access --public-access-prevention
          fi
          gcloud storage buckets update "$bucket" --versioning --public-access-prevention
      - name: Validate and plan
        if: inputs.action == 'plan' || inputs.action == 'apply'
        working-directory: infra/gcp
        run: |
          terraform fmt -check
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=foundation.tfplan
      - name: Apply the saved plan
        if: inputs.action == 'apply'
        working-directory: infra/gcp
        run: |
          terraform apply -input=false foundation.tfplan
          terraform output -json > foundation-outputs.json
          gcloud storage cp foundation-outputs.json gs://fleet-governance-artifacts-449245570324/foundation/outputs.json
          terraform output >> "$GITHUB_STEP_SUMMARY"
