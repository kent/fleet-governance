name: GCP independent governance history
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: gcp-fleet-governance
  cancel-in-progress: false
env:
  CLOUDSDK_CORE_PROJECT: fleet-governance
jobs:
  provision:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.2
          terraform_wrapper: false
      - name: Provision only the independent history resources
        working-directory: infra/gcp
        run: |
          terraform init -input=false
          terraform validate
          terraform plan -input=false -out=readside.tfplan
          terraform show -json readside.tfplan > readside-plan.json
          python3 - <<'PY'
          import json
          plan = json.load(open('readside-plan.json'))
          for resource in plan.get('resource_changes', []):
              actions = resource['change']['actions']
              if actions == ['no-op'] or actions == ['read']:
                  continue
              if not resource['name'].startswith('readside') or 'delete' in actions:
                  raise SystemExit('Unexpected infrastructure mutation: ' + resource['address'])
              print(resource['address'], actions)
          PY
          terraform apply -input=false readside.tfplan
      - name: Confirm worker remains stopped and history host is separate
        run: |
          gcloud compute instances list --filter='name=(fleet-research fleet-readside)' \
            --format='table(name,status,machineType.basename(),serviceAccounts.email)'
