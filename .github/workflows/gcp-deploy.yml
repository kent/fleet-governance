name: GCP deploy Fleet demo
on:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy after building (disable to validate and publish images only)
        type: boolean
        default: true
      site_only:
        description: Deploy only the public site and operator controls, without starting or changing the worker
        type: boolean
        default: false
      image_revision:
        description: Reuse images from a full main-branch commit SHA (blank builds this revision)
        type: string
        default: ''
      openrouter_secret_version:
        description: Enabled numeric experiment OpenRouter secret version
        type: string
        default: '1'
      verify_inference:
        description: Make one live Muse Spark connectivity check, capped at two cents
        type: boolean
        default: false
permissions:
  contents: read
  id-token: write
concurrency:
  # Image-only builds may run while a governance drill owns the worker. All
  # operations that start or deploy compute still share the infrastructure lock.
  group: ${{ inputs.deploy && 'gcp-fleet-governance' || format('gcp-fleet-build-{0}', github.run_id) }}
  cancel-in-progress: false
env:
  CLOUDSDK_CORE_PROJECT: fleet-governance
  REGISTRY: us-central1-docker.pkg.dev/fleet-governance/fleet
jobs:
  build:
    if: inputs.image_revision == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ inputs.site_only && fromJSON('[{"name":"runner","dockerfile":"infra/gcp/Runner.Dockerfile","target":""}]') || fromJSON('[{"name":"runner","dockerfile":"infra/gcp/Runner.Dockerfile","target":""},{"name":"dao-node","dockerfile":"infra/dao-node/Dockerfile","target":""},{"name":"cpls","dockerfile":"infra/cpls/Dockerfile","target":""},{"name":"agora","dockerfile":"infra/agora-next/Dockerfile","target":"production"}]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: Build production image with registry cache
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: |
          gcloud auth configure-docker us-central1-docker.pkg.dev --quiet
          docker buildx create --use
          args=()
          [[ -z "$TARGET" ]] || args+=(--target "$TARGET")
          docker buildx build --platform linux/amd64 --load \
            --cache-from "type=registry,ref=$REGISTRY/$IMAGE_NAME:buildcache" \
            --cache-to "type=registry,ref=$REGISTRY/$IMAGE_NAME:buildcache,mode=max" \
            -f "$DOCKERFILE" -t "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA" "${args[@]}" .
      - name: Verify Runner starts without credentials
        if: matrix.name == 'runner'
        run: |
          trap 'docker rm -f fleet-image-smoke >/dev/null 2>&1 || true' EXIT
          docker run --detach --name fleet-image-smoke --network none "$REGISTRY/runner:$GITHUB_SHA"
          for _ in $(seq 1 30); do
            if docker exec fleet-image-smoke curl --fail --silent --output /dev/null http://127.0.0.1:3100; then
              echo 'Runner serves its UI without credentials or external network access.'
              exit 0
            fi
            sleep 2
          done
          docker logs fleet-image-smoke
          exit 1
      - name: Refresh Google credentials after the build
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - name: Publish immutable image
        env:
          IMAGE_NAME: ${{ matrix.name }}
        run: |
          docker push "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA"
          immutable=$(docker inspect --format='{{index .RepoDigests 0}}' "$REGISTRY/$IMAGE_NAME:$GITHUB_SHA")
          [[ "$immutable" == *@sha256:* ]]
          printf 'Published %s.\n' "$immutable" >> "$GITHUB_STEP_SUMMARY"
  deploy:
    needs: build
    if: ${{ always() && !cancelled() && inputs.deploy && (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: fleet-governance
          workload_identity_provider: projects/449245570324/locations/global/workloadIdentityPools/github/providers/github
          service_account: fleet-provisioner@fleet-governance.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: beta
      - name: Validate the release revision
        env:
          REQUESTED_REVISION: ${{ inputs.image_revision }}
        run: |
          revision=${REQUESTED_REVISION:-$GITHUB_SHA}
          [[ "$revision" =~ ^[a-f0-9]{40}$ ]]
          git merge-base --is-ancestor "$revision" "$GITHUB_SHA"
          echo "IMAGE_REVISION=$revision" >> "$GITHUB_ENV"
      - name: Resolve image digests and enabled secret versions
        env:
          OPENROUTER_VERSION: ${{ inputs.openrouter_secret_version }}
          SITE_ONLY: ${{ inputs.site_only }}
        run: |
          [[ "$OPENROUTER_VERSION" =~ ^[1-9][0-9]*$ ]]
          if [[ "$SITE_ONLY" != true ]]; then
          for secret in fleet-openrouter-experiment-api-key fleet-postgres-password fleet-jwt-secret fleet-base-sepolia-wallets fleet-base-sepolia-rpc-url fleet-base-sepolia-ws-url fleet-cdp-api-key-id fleet-cdp-api-key-secret; do
            version=1
            [[ "$secret" != fleet-openrouter-experiment-api-key ]] || version="$OPENROUTER_VERSION"
            state=$(gcloud secrets versions describe "$version" --secret="$secret" --format='value(state)')
            [[ "$state" == ENABLED ]]
          done
          fi
          images=(runner)
          [[ "$SITE_ONLY" == true ]] || images+=(dao-node cpls agora)
          for name in "${images[@]}"; do
            digest=$(gcloud artifacts docker images describe "$REGISTRY/$name:$IMAGE_REVISION" --format='value(image_summary.digest)')
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            variable="IMAGE_${name^^}"
            variable="${variable//-/_}"
            printf '%s=%s/%s@%s\n' "$variable" "$REGISTRY" "$name" "$digest" >> "$GITHUB_ENV"
          done
      - name: Deploy independent compute governance controller
        if: ${{ !inputs.site_only }}
        run: bash infra/gcp/deploy-compute-controller.sh
      - name: Deploy fixed simulation preparation job
        if: ${{ !inputs.site_only }}
        run: bash infra/gcp/deploy-simulation.sh
      - name: Check and start the fixed worker
        if: ${{ !inputs.site_only }}
        run: |
          # A routine deployment must not revive an allocation that governance stopped.
          # This check reads the independent bucket, not the worker's run status.
          python3 -B infra/gcp/assert-compute-unarmed.py
          state=$(gcloud compute instances describe fleet-research --zone=us-central1-a --format='value(status)')
          if [[ "$state" == TERMINATED ]]; then
            gcloud compute instances start fleet-research --zone=us-central1-a --quiet
          elif [[ "$state" != RUNNING ]]; then
            echo "VM is in $state; wait for its current operation." >&2
            exit 1
          fi
          ip=$(gcloud compute instances describe fleet-research --zone=us-central1-a --format='value(networkInterfaces[0].networkIP)')
          [[ "$ip" =~ ^10\.42\.0\.[0-9]+$ ]]
          echo "FLEET_AGORA_HOST=$ip" >> "$GITHUB_ENV"
      - name: Read worker address without starting it
        if: inputs.site_only
        run: |
          ip=$(gcloud compute instances describe fleet-research --zone=us-central1-a --format='value(networkInterfaces[0].networkIP)')
          [[ "$ip" =~ ^10\.42\.0\.[0-9]+$ ]]
          echo "FLEET_AGORA_HOST=$ip" >> "$GITHUB_ENV"
      - name: Deploy public viewing and protected operator controls
        run: bash infra/gcp/deploy-site.sh
      - name: Prepare worker configuration
        if: ${{ !inputs.site_only }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          config = {
              'FLEET_REVISION': os.environ['IMAGE_REVISION'],
              'FLEET_CONTROL_URL': os.environ['FLEET_CONTROL_URL'],
              'FLEET_WORKER_ENABLED': '1',
              'FLEET_DAO_IMAGE': os.environ['IMAGE_DAO_NODE'],
              'FLEET_CPLS_IMAGE': os.environ['IMAGE_CPLS'],
              'FLEET_AGORA_IMAGE': os.environ['IMAGE_AGORA'],
          }
          Path('infra/gcp/runtime/worker-config.json').write_text(json.dumps(config))
          PY
      - name: Deploy worker through IAP and verify containment
        if: ${{ !inputs.site_only }}
        env:
          OPENROUTER_VERSION: ${{ inputs.openrouter_secret_version }}
          VERIFY_INFERENCE: ${{ inputs.verify_inference }}
        run: |
          # RUNNING precedes SSH readiness after a cold VM start. Retry only the
          # read-only connectivity probe, never a partially executed deployment.
          ready=false
          for attempt in $(seq 1 12); do
            if gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet \
              --ssh-flag='-oConnectTimeout=10' --ssh-flag='-oConnectionAttempts=1' --command=true; then
              ready=true
              break
            fi
            sleep 5
          done
          [[ "$ready" == true ]] || { echo 'Worker SSH did not become ready.' >&2; exit 1; }
          remote="fleet-runtime-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          gcloud compute scp --recurse infra/gcp/runtime "fleet-research:~/$remote" --zone=us-central1-a --tunnel-through-iap --quiet
          gcloud compute ssh fleet-research --zone=us-central1-a --tunnel-through-iap --quiet \
            --command="sudo bash \$HOME/$remote/deploy-vm.sh '$IMAGE_RUNNER' '$IMAGE_REVISION' '$OPENROUTER_VERSION' '$VERIFY_INFERENCE'"
          printf 'Deployed revision %s. Launcher: %s/experiments\n' "$IMAGE_REVISION" "$FLEET_CONTROL_URL" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify anonymous viewing and blocked mutations
        run: python3 -B infra/gcp/verify-public-site.py
