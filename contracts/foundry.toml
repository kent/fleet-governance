[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
solc_version = '0.8.29'
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "../deployments" },
]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 1024

[lint]
lint_on_build = false
