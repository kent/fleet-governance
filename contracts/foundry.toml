[profile.default]
src = 'src'
out = 'out'
libs = ['lib']
test = 'test'
script = 'script'
optimizer = true
optimizer_runs = 200
evm_version = 'cancun'
solc_version = '0.8.29'
fs_permissions = [
  { access = "read-write", path = "./" },
  { access = "read-write", path = "../deployments" },
]
# Silences solc warning 5740 (Unreachable code), raised inside the vendored ERC20.sol
# because FleetVotes._approve always reverts by design; see docs/compatibility-notes.md.
ignored_warnings_from = ["lib/agora-governor/lib/openzeppelin-contracts"]

[fuzz]
runs = 256

[invariant]
runs = 64
depth = 32
fail_on_revert = false

[profile.ci.fuzz]
runs = 1024

# solar (forge lint) cannot resolve the submodule remapping; see docs/compatibility-notes.md
[lint]
lint_on_build = false
